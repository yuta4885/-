  /* 左上: 日付と曜日 */
  #date {
    position: absolute; left: 36px; top: 22px;
    font-size: 64px; font-weight: 700; letter-spacing: .04em;
    line-height: 1.1;
  }
  #date small { font-size: 40px; font-weight: 500; margin-left: 10px; }
  #date .sat { color: #6fb1ff; }
  #date .sun { color: #ff7b7b; }

  /* 右下: 集計 */
  #stats {
    position: absolute; right: 30px; bottom: 26px;
    width: 520px; padding: 18px 20px 20px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
  }
  #stats .row { display: flex; gap: 14px; }
  #stats .cell { flex: 1; text-align: center; }
  #stats .label { font-size: 24px; color: var(--muted); }
  #stats .num { white-space: nowrap; font-size: 64px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #stats .num small { font-size: 24px; font-weight: 500; margin-left: 2px; }
  #stats .present .num { color: var(--on); }
  #stats .absent .num { color: #ff6b6b; }
  #stats .rate .num { color: #7ee0a0; }
  #bar { height: 16px; border-radius: 8px; background: #3a1d22; margin-top: 12px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #7ee0a0; transition: width .3s; }

  /* 人のタイル */
  .tile {
    position: absolute; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 14px; border: 3px solid transparent;
    cursor: pointer; text-align: center; overflow: hidden;
    transition: background-color .12s, color .12s;
  }
  .tile .name { font-weight: 800; white-space: nowrap; line-height: 1.15; }
  .tile .st { font-size: 22px; font-weight: 600; margin-top: 4px; opacity: .8; }
  .tile.on  { background: var(--on); color: var(--on-text); }
  .tile.off { background: var(--red);   color: var(--red-text); }
  .tile:active { filter: brightness(.88); }

  body.edit .tile { cursor: move; border: 3px dashed var(--accent); }
  body.edit .tile.dragging { z-index: 50; opacity: .85; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  body.edit #grid-guide { display: block; }
  #grid-guide {
    display: none; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 10px 10px;
  }

  /* 編集ツールバー */
  #toolbar {
    position: absolute; right: 20px; top: 16px;
    display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center;
    gap: 10px; max-width: 1100px;
  }
  button, .btn {
    font: inherit; font-size: 22px; font-weight: 600;
    min-height: 52px; padding: 0 20px;
    background: var(--panel); color: var(--text);
    border: 2px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  button:active { filter: brightness(1.3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: #ff8a8a; }
  #btn-edit { opacity: .45; min-height: 46px; font-size: 20px; }
  .edit-only { display: none; }
  body.edit .edit-only { display: inline-flex; align-items: center; }
  body.edit #btn-edit { display: none; }
  .ctl { gap: 8px; font-size: 20px; color: var(--muted); padding: 0 6px; }
  .ctl input[type=range] { width: 130px; height: 36px; }
  .ctl label.chk { display: flex; align-items: center; gap: 6px; }
  .ctl input[type=checkbox] { width: 26px; height: 26px; }
  #hint {
    position: absolute; left: 36px; bottom: 26px; font-size: 22px; color: var(--muted);
    display: none;
  }
  body.edit #hint { display: block; }

  /* ダイアログ */
  #modal {
    position: absolute; inset: 0; display: none; z-index: 100;
    background: rgba(0,0,0,.6); align-items: flex-start; justify-content: center;
  }
  #modal.show { display: flex; }
  #dlg {
    margin-top: 170px; width: 640px; padding: 28px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 18px;
  }
  #dlg h2 { margin: 0 0 16px; font-size: 28px; }
  #dlg input[type=text] {
    width: 100%; font: inherit; font-size: 40px; padding: 10px 14px;
    background: #121823; color: var(--text); border: 2px solid var(--line); border-radius: 10px;
    -webkit-user-select: text; user-select: text;
  }
  #dlg .btns { display: flex; gap: 12px; margin-top: 22px; justify-content: flex-end; }
  #dlg .btns .sp { flex: 1; }

  /* 出勤・退勤の確認 */
  #confirm {
    position: absolute; inset: 0; display: none; z-index: 110;
    background: rgba(0,0,0,.6); align-items: center; justify-content: center;
  }
  #confirm.show { display: flex; }
  #cbox {
    width: 760px; padding: 36px 40px 32px; text-align: center;
    background: var(--panel); border: 3px solid var(--line); border-radius: 22px;
  }
  #c-name { font-size: 64px; font-weight: 800; line-height: 1.2; word-break: break-all; }
  #c-msg { font-size: 44px; font-weight: 700; margin-top: 10px; }
  #cbox .btns { display: flex; gap: 20px; margin-top: 32px; }
  #cbox .btns button { flex: 1; min-height: 110px; font-size: 40px; border-radius: 16px; }
  #c-ok.to-on  { background: var(--on); border-color: var(--on); color: var(--on-text); }

  /* あいさつ表示（1.5秒で消える） */
  #greet {
    position: absolute; left: 50%; top: 50%; z-index: 120;
    transform: translate(-50%, -50%) scale(.9);
    padding: 40px 90px; border-radius: 28px; border: 6px solid #fff;
    font-size: 96px; font-weight: 800; white-space: nowrap;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
  }
  #greet.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #greet.in  { background: var(--on); color: var(--on-text); }
  #greet.out { background: var(--red); color: var(--red-text); }
  #c-ok.to-off { background: var(--red); border-color: var(--red); color: var(--red-text); }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="grid-guide"></div>
  <div id="date"></div>

  <div id="toolbar">
    <button id="btn-add" class="edit-only">＋ 追加</button>
    <button id="btn-arrange" class="edit-only">自動整列</button>
    <span class="ctl edit-only">幅<input id="rng-w" type="range" min="120" max="320" step="10"></span>
    <span class="ctl edit-only">高さ<input id="rng-h" type="range" min="70" max="200" step="10"></span>
    <span class="ctl edit-only"><label class="chk"><input id="chk-auto" type="checkbox">日付が変わったら全員退勤へ</label></span>
    <button id="btn-reset" class="edit-only danger">全員退勤にする</button>
    <button id="btn-export" class="edit-only">書き出し</button>
    <button id="btn-import" class="edit-only">読み込み</button>
    <button id="btn-done" class="edit-only primary">完了</button>
    <button id="btn-edit">編集</button>
    <input id="file" type="file" accept="application/json" hidden>
  </div>

  <div id="hint">ドラッグで移動 ／ タップで名前変更・削除 ／ 「完了」で通常画面へ</div>

  <div id="stats">
    <div class="row">
      <div class="cell present"><div class="label">出勤</div><div class="num"><span id="n-present">0</span><small>名</small></div></div>
      <div class="cell absent"><div class="label">未出勤</div><div class="num"><span id="n-absent">0</span><small>名</small></div></div>
      <div class="cell rate"><div class="label">出勤割合</div><div class="num"><span id="n-rate">0</span><small>%</small></div></div>
    </div>
    <div id="bar"><i></i></div>
  </div>

  <div id="confirm">
    <div id="cbox">
      <div id="c-name"></div>
      <div id="c-msg"></div>
      <div class="btns">
        <button id="c-cancel">いいえ</button>
        <button id="c-ok"></button>
      </div>
    </div>
  </div>

  <div id="greet"></div>

  <div id="modal">
    <div id="dlg">
      <h2>名前の変更</h2>
      <input id="in-name" type="text" maxlength="12" autocomplete="off">
      <div class="btns">
        <button id="dlg-del" class="danger">削除</button>
        <span class="sp"></span>
        <button id="dlg-cancel">キャンセル</button>
        <button id="dlg-ok" class="primary">保存</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const STAGE_W = 1920, STAGE_H = 1080;
  const SNAP = 10, GAP = 15, MARGIN_X = 30, TOP_Y = 140;
  const KEY = 'attendance-board-v1';
  const WEEK = ['日', '月', '火', '水', '木', '金', '土'];

  const $ = id => document.getElementById(id);
  const stage = $('stage');

  /* ---------- 状態 ---------- */
  let state = load() || defaultState();

  function defaultState() {
    const s = { tileW: 210, tileH: 120, autoReset: false, lastDate: todayKey(), nextId: 1, people: [] };
    for (let i = 1; i <= 36; i++) s.people.push({ id: s.nextId++, name: '氏名' + String(i).padStart(2, '0'), x: 0, y: 0, on: false });
    arrange(s);
    return s;
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      return s && Array.isArray(s.people) ? s : null;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 保存不可でも動作は継続 */ }
  }
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  /* ---------- 配置 ---------- */
  function arrange(s) {
    const cols = Math.max(1, Math.floor((STAGE_W - MARGIN_X * 2 + GAP) / (s.tileW + GAP)));
    s.people.forEach((p, i) => {
      p.x = MARGIN_X + (i % cols) * (s.tileW + GAP);
      p.y = TOP_Y + Math.floor(i / cols) * (s.tileH + GAP);
    });
  }
  function freeSlot() {
    const cols = Math.max(1, Math.floor((STAGE_W - MARGIN_X * 2 + GAP) / (state.tileW + GAP)));
    for (let i = 0; i < 400; i++) {
      const x = MARGIN_X + (i % cols) * (state.tileW + GAP);
      const y = TOP_Y + Math.floor(i / cols) * (state.tileH + GAP);
      const used = state.people.some(p => Math.abs(p.x - x) < state.tileW / 2 && Math.abs(p.y - y) < state.tileH / 2);
      if (!used) return { x, y };
    }
    return { x: MARGIN_X, y: TOP_Y };
  }

  /* ---------- 描画 ---------- */
  const tiles = new Map();

  function fitName(el, name) {
    const len = Math.max(1, [...name].length);
    const size = Math.min(state.tileH * 0.36, (state.tileW - 20) / len);
    el.style.fontSize = Math.max(16, Math.floor(size)) + 'px';
  }
  function styleTile(el, p) {
    el.style.left = p.x + 'px';
    el.style.top = p.y + 'px';
    el.style.width = state.tileW + 'px';
    el.style.height = state.tileH + 'px';
  }
  function renderAll() {
    const alive = new Set(state.people.map(p => p.id));
    for (const [id, el] of tiles) if (!alive.has(id)) { el.remove(); tiles.delete(id); }
    for (const p of state.people) {
      let el = tiles.get(p.id);
      if (!el) {
        el = document.createElement('div');
        el.className = 'tile';
        el.innerHTML = '<div class="name"></div><div class="st"></div>';
        el.dataset.id = p.id;
        stage.appendChild(el);
        tiles.set(p.id, el);
        bindTile(el);
      }
      styleTile(el, p);
      el.querySelector('.name').textContent = p.name;
      fitName(el.querySelector('.name'), p.name);
      el.querySelector('.st').textContent = p.on ? '出勤' : '退勤';
      el.classList.toggle('on', p.on);
      el.classList.toggle('off', !p.on);
    }
    renderStats();
  }
  function renderStats() {
    const total = state.people.length;
    const present = state.people.filter(p => p.on).length;
    const rate = total ? Math.round(present / total * 1000) / 10 : 0;
    $('n-present').textContent = present;
    $('n-absent').textContent = total - present;
    $('n-rate').textContent = rate.toFixed(1);
    $('bar').firstElementChild.style.width = rate + '%';
  }
  function renderDate() {
    const d = new Date();
    const w = d.getDay();
    const cls = w === 0 ? 'sun' : w === 6 ? 'sat' : '';
    const html = `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日<small class="${cls}">（${WEEK[w]}）</small>`;
    if ($('date').dataset.k !== html) { $('date').innerHTML = html; $('date').dataset.k = html; }
    if (state.autoReset && state.lastDate !== todayKey()) {
      state.people.forEach(p => p.on = false);
      state.lastDate = todayKey();
      save(); renderAll();
    }
  }

  /* ---------- 画面フィット ---------- */
  function fit() {
    const s = Math.min(innerWidth / STAGE_W, innerHeight / STAGE_H);
    stage.style.transform = `translate(${(innerWidth - STAGE_W * s) / 2}px, ${(innerHeight - STAGE_H * s) / 2}px) scale(${s})`;
    stage.dataset.scale = s;
  }
  const scale = () => parseFloat(stage.dataset.scale) || 1;

  /* ---------- タイル操作 ---------- */
  const isEdit = () => document.body.classList.contains('edit');

  function bindTile(el) {
    let start = null;
    el.addEventListener('pointerdown', e => {
      const p = state.people.find(q => q.id == el.dataset.id);
      if (!p) return;
      start = { sx: e.clientX, sy: e.clientY, ox: p.x, oy: p.y, moved: false, p };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!start || !isEdit()) return;
      const dx = e.clientX - start.sx, dy = e.clientY - start.sy;
      if (!start.moved && Math.hypot(dx, dy) < 8) return;
      start.moved = true;
      el.classList.add('dragging');
      const k = scale();
      const snap = v => Math.round(v / SNAP) * SNAP;
      start.p.x = Math.min(STAGE_W - state.tileW, Math.max(0, snap(start.ox + dx / k)));
      start.p.y = Math.min(STAGE_H - state.tileH, Math.max(0, snap(start.oy + dy / k)));
      styleTile(el, start.p);
    });
    el.addEventListener('pointerup', e => {
      if (!start) return;
      const s = start; start = null;
      el.classList.remove('dragging');
      if (s.moved) { save(); return; }
      if (Math.hypot(e.clientX - s.sx, e.clientY - s.sy) > 12) return;
      if (isEdit()) openDialog(s.p); else toggle(s.p);
    });
    el.addEventListener('pointercancel', () => { start = null; el.classList.remove('dragging'); });
  }
  /* ---------- 出勤・退勤の確認 ---------- */
  let pending = null;
  function toggle(p) {
    pending = p;
    $('c-name').textContent = p.name + ' さん';
    $('c-msg').textContent = p.on ? '退勤しますか？' : '出勤しますか？';
    const ok = $('c-ok');
    ok.textContent = p.on ? '退勤する' : '出勤する';
    ok.className = p.on ? 'to-off' : 'to-on';
    $('confirm').classList.add('show');
  }
  function closeConfirm() { $('confirm').classList.remove('show'); pending = null; }
  $('c-ok').onclick = () => {
    if (pending) {
      pending.on = !pending.on;
      save(); renderAll();
      greet(pending.on);
    }
    closeConfirm();
  };
  let greetTimer = null;
  function greet(isIn) {
    const g = $('greet');
    g.textContent = isIn ? 'おはようございます' : 'お疲れ様でした';
    g.className = (isIn ? 'in' : 'out') + ' show';
    clearTimeout(greetTimer);
    greetTimer = setTimeout(() => g.classList.remove('show'), 1500);
  }
  $('c-cancel').onclick = closeConfirm;
  $('confirm').addEventListener('pointerdown', e => { if (e.target === $('confirm')) closeConfirm(); });

  /* ---------- ダイアログ ---------- */
  let editing = null;
  function openDialog(p) {
    editing = p;
    $('in-name').value = p.name;
    $('modal').classList.add('show');
    setTimeout(() => { $('in-name').focus(); $('in-name').select(); }, 50);
  }
  function closeDialog() { $('modal').classList.remove('show'); editing = null; }
  $('dlg-ok').onclick = () => {
    if (editing) editing.name = $('in-name').value.trim() || editing.name;
    save(); renderAll(); closeDialog();
  };
  $('dlg-cancel').onclick = closeDialog;
  $('dlg-del').onclick = () => {
    if (!editing) return;
    if (!confirm(`「${editing.name}」を削除しますか？`)) return;
    state.people = state.people.filter(q => q !== editing);
    save(); renderAll(); closeDialog();
  };
  $('in-name').addEventListener('keydown', e => { if (e.key === 'Enter') $('dlg-ok').click(); });
  $('modal').addEventListener('pointerdown', e => { if (e.target === $('modal')) closeDialog(); });

  /* ---------- ツールバー ---------- */
  function setEdit(on) {
    document.body.classList.toggle('edit', on);
    closeDialog();
  }
  $('btn-edit').onclick = () => setEdit(true);
  $('btn-done').onclick = () => setEdit(false);
  $('btn-add').onclick = () => {
    const { x, y } = freeSlot();
    const p = { id: state.nextId++, name: '氏名' + String(state.people.length + 1).padStart(2, '0'), x, y, on: false };
    state.people.push(p);
    save(); renderAll(); openDialog(p);
  };
  $('btn-arrange').onclick = () => {
    if (!confirm('全員を順番に整列し直します。よろしいですか？')) return;
    arrange(state); save(); renderAll();
  };
  $('btn-reset').onclick = () => {
    if (!confirm('全員を「退勤」に戻します。よろしいですか？')) return;
    state.people.forEach(p => p.on = false);
    save(); renderAll();
  };
  $('rng-w').oninput = e => { state.tileW = +e.target.value; save(); renderAll(); };
  $('rng-h').oninput = e => { state.tileH = +e.target.value; save(); renderAll(); };
  $('chk-auto').onchange = e => { state.autoReset = e.target.checked; state.lastDate = todayKey(); save(); };

  $('btn-export').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'attendance-board.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('btn-import').onclick = () => $('file').click();
  $('file').onchange = e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const s = JSON.parse(r.result);
        if (!Array.isArray(s.people)) throw new Error();
        state = s;
        state.nextId = state.nextId || Math.max(0, ...s.people.map(p => p.id)) + 1;
        save(); syncControls(); renderAll();
      } catch (err) { alert('読み込めませんでした。書き出したファイルを選んでください。'); }
    };
    r.readAsText(f);
    e.target.value = '';
  };
  function syncControls() {
    $('rng-w').value = state.tileW;
    $('rng-h').value = state.tileH;
    $('chk-auto').checked = !!state.autoReset;
  }

  /* ---------- 起動 ---------- */
  addEventListener('resize', fit);
  addEventListener('contextmenu', e => e.preventDefault());
  fit(); syncControls(); renderDate(); renderAll();
  setInterval(renderDate, 1000);
})();
</script>
</body>
</html>
